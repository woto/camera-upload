<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Video Upload</title>
  <link href="https://releases.transloadit.com/uppy/v4.13.3/uppy.min.css" rel="stylesheet" />
  <style>
    body { font-family: system-ui, sans-serif; margin: 0; background: #f5f6f8; color: #1a1a1a; }
    header { background: #1f2937; color: #fff; padding: 16px 24px; }
    header h1 { margin: 0; font-size: 20px; }
    header p { margin: 4px 0 0; color: #9ca3af; font-size: 13px; }
    main { max-width: 1040px; margin: 24px auto; padding: 0 16px; display: grid; gap: 24px; }
    .card { background: #fff; border-radius: 10px; box-shadow: 0 1px 3px rgba(0,0,0,.08); padding: 16px; }
    .card h2 { margin: 0 0 12px; font-size: 16px; }
    table { width: 100%; border-collapse: collapse; font-size: 14px; }
    th, td { text-align: left; padding: 8px; border-bottom: 1px solid #eee; vertical-align: top; }
    th { color: #6b7280; font-weight: 600; font-size: 12px; text-transform: uppercase; }
    .bar { background: #e5e7eb; border-radius: 6px; height: 10px; width: 120px; overflow: hidden; }
    .bar > span { display: block; height: 100%; background: #2563eb; transition: width .3s; }
    .thumb { width: 192px; height: 108px; object-fit: cover; border-radius: 4px; background: #e5e7eb; display: block; }
    .badge { font-size: 11px; padding: 2px 8px; border-radius: 10px; white-space: nowrap; }
    .status-badges { display: flex; flex-wrap: wrap; gap: 4px; align-items: center; }
    .badge.done { background: #dcfce7; color: #166534; }
    .badge.progress { background: #fef9c3; color: #854d0e; }
    .badge.absent { background: #e5e7eb; color: #6b7280; }
    a.btn, button.btn { font-size: 12px; padding: 4px 8px; border-radius: 6px; border: 1px solid #d1d5db;
      background: #fff; cursor: pointer; text-decoration: none; color: #1f2937; display: inline-block; margin: 1px 0; }
    a.btn:hover, button.btn:hover { background: #f3f4f6; }
    /* Semantic, colour-coded actions (filled so the intent reads at a glance). */
    button.btn.primary { color: #fff; background: #2563eb; border-color: #2563eb; }
    button.btn.primary:hover { background: #1d4ed8; }
    button.btn.frame, button.btn.export, button.btn.fisheye { color: #fff; background: #4f46e5; border-color: #4f46e5; }
    button.btn.frame:hover, button.btn.export:hover, button.btn.fisheye:hover { background: #4338ca; }
    button.btn.danger { color: #fff; background: #dc2626; border-color: #dc2626; }  /* delete → red */
    button.btn.danger:hover { background: #b91c1c; }
    button.btn.close { color: #fff; background: #9ca3af; border-color: #9ca3af; }   /* close panel → grey */
    button.btn.close:hover { background: #6b7280; }
    .muted { color: #9ca3af; font-size: 12px; }
    .title-input { width: 100%; font-size: 14px; padding: 4px 6px; border: 1px solid #d1d5db; border-radius: 6px; }
    .title-label { cursor: text; display: inline-block; font-size: 14px; padding: 4px 6px; border: 1px solid transparent; border-radius: 6px; min-width: 80px; }
    .title-label:hover { border-color: #e5e7eb; background: #f9fafb; }
    .tags { display: flex; flex-wrap: wrap; gap: 4px; align-items: center; }
    .tag { background: #eef2ff; color: #3730a3; border-radius: 10px; padding: 2px 8px; font-size: 12px; display: inline-flex; gap: 4px; align-items: center; }
    .tag button { border: none; background: none; cursor: pointer; color: #6366f1; font-size: 12px; padding: 0; }
    .tag-input { width: 90px; font-size: 12px; padding: 3px 6px; border: 1px solid #d1d5db; border-radius: 6px; }
    .picker { background: #f9fafb; border: 1px solid #e5e7eb; border-radius: 8px; padding: 12px; }
    .export-rec { background: #fff; border: 1px solid #e5e7eb; border-radius: 8px; padding: 16px 18px; margin: 14px 0; display: flex; flex-direction: column; gap: 14px; }
    .export-rec .row { gap: 16px; }
    .picker img { max-width: 100%; border-radius: 6px; display: block; margin: 8px 0; max-height: 320px; }
    .picker .row { display: flex; gap: 12px; align-items: center; flex-wrap: wrap; }
    .picker h4 { margin: 14px 0 4px; font-size: 13px; color: #374151; }
    .picker label { font-size: 13px; color: #374151; }
    .picker .picker-head { justify-content: space-between; }
    .picker input[type=range] { flex: 1; min-width: 200px; }
    .url-box { flex: 1; min-width: 200px; font-size: 12px; padding: 6px; border: 1px solid #d1d5db; border-radius: 6px; font-family: monospace; }
    .actions { white-space: nowrap; }
    /* When a panel is expanded, tie it visually to its source row: tint both and
       run a matching colour accent down the left edge of the row + the panel. */
    tr.row-open.open-frame > td { background: #eef2ff; }
    tr.row-open.open-frame > td:first-child { box-shadow: inset 4px 0 0 #4f46e5; }
    tr.row-open.open-export > td { background: #eef2ff; }
    tr.row-open.open-export > td:first-child { box-shadow: inset 4px 0 0 #4f46e5; }
    .panel-title b { font-size: 14px; }
    .panel-for { font-weight: 600; color: #374151; margin-left: 6px; }
    .panel-for .muted { font-weight: 400; }
    .filterbar { display: flex; gap: 12px; align-items: center; flex-wrap: wrap; margin-bottom: 12px; }
    .filterbar #search { max-width: 280px; }
    .filter-tag { cursor: pointer; user-select: none; background: #eef2ff; color: #3730a3; border-radius: 10px; padding: 2px 10px; font-size: 12px; border: 1px solid transparent; }
    .filter-tag.active { background: #3730a3; color: #fff; }
    .pager { display: flex; gap: 12px; align-items: center; justify-content: flex-end; margin-top: 12px; font-size: 13px; color: #6b7280; }
  </style>
</head>
<body>
  <header>
    <h1>Video Upload</h1>
    <p>Resumable uploads of large files (tus) · drag &amp; drop or pick a file</p>
  </header>

  <main>
    <div class="card">
      <div id="uppy"></div>
    </div>

    <div class="card">
      <h2>Uploads</h2>
      <div class="filterbar">
        <input id="search" class="title-input" placeholder="Search by name…" />
        <div id="tag-filters" class="tags"></div>
      </div>
      <div id="uploads"><p class="muted">Loading…</p></div>
      <div id="pager" class="pager"></div>
    </div>
  </main>

  <datalist id="all-tags"></datalist>

  <script src="https://releases.transloadit.com/uppy/v4.13.3/uppy.min.js"></script>
  <script>
    const TUS_ENDPOINT = '/files/';
    // Base URL of camera-motion (injected server-side). The "Open in camera-motion"
    // button opens its client with the proxy URL prefilled.
    const CAMERA_MOTION_URL = "__CAMERA_MOTION_URL__".replace(/\/+$/, '');
    // Base URL of camera-fisheye (injected server-side). The "Fisheye" button opens
    // its client with the video id and a frame, and the row shows a perspective badge.
    const CAMERA_FISHEYE_URL = "__CAMERA_FISHEYE_URL__".replace(/\/+$/, '');

    const uppy = new Uppy.Uppy({
      autoProceed: false,
      restrictions: { allowedFileTypes: ['video/*'] },
    })
      .use(Uppy.Dashboard, {
        inline: true,
        target: '#uppy',
        height: 320,
        proudlyDisplayPoweredByUppy: false,
        note: 'Video only. Uploads resume automatically after a dropped connection.',
      })
      .use(Uppy.Tus, {
        endpoint: TUS_ENDPOINT,
        chunkSize: 50 * 1024 * 1024, // 50 MiB
        retryDelays: [0, 1000, 3000, 5000, 10000],
        removeFingerprintOnSuccess: true,
      })
      .use(Uppy.GoldenRetriever);

    // After an upload finishes, the server still needs a moment to run ffprobe
    // and generate the thumbnail. Poll a few times in quick succession so the
    // thumbnail appears almost immediately instead of waiting for the next
    // 3-second tick.
    function refreshBurst() { [300, 800, 1500, 2500, 4000].forEach(ms => setTimeout(refresh, ms)); }
    uppy.on('complete', refreshBurst);
    uppy.on('upload-success', refreshBurst);

    // ---------- helpers ----------
    const uploadsEl = document.getElementById('uploads');
    const tagsDatalist = document.getElementById('all-tags');
    let rowState = {};   // id -> { title, tags } (reflects in-progress edits)
    let renderedIds = '';

    function fmtSize(bytes) {
      if (!bytes) return '—';
      const units = ['B', 'KB', 'MB', 'GB', 'TB'];
      let i = 0, n = bytes;
      while (n >= 1024 && i < units.length - 1) { n /= 1024; i++; }
      return n.toFixed(1) + ' ' + units[i];
    }
    function fmtTime(s) {
      s = Math.max(0, Math.floor(s));
      const m = Math.floor(s / 60), sec = s % 60;
      return m + ':' + String(sec).padStart(2, '0');
    }
    function esc(s) {
      return (s || '').replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
    }
    async function api(method, url, body) {
      const opts = { method };
      if (body !== undefined) { opts.headers = { 'Content-Type': 'application/json' }; opts.body = JSON.stringify(body); }
      return fetch(url, opts);
    }
    async function saveMeta(id) {
      const st = rowState[id];
      await api('PATCH', '/uploads/' + id, { title: st.title, tags: st.tags });
      loadTags();
    }

    // ---------- full render ----------
    function render(uploads) {
      if (!uploads.length) {
        uploadsEl.innerHTML = '<p class="muted">No uploads yet.</p>';
        return;
      }
      const rows = uploads.map(u => {
        const thumb = u.has_thumbnail
          ? '<img class="thumb" src="/uploads/' + u.id + '/thumbnail?ts=' + Date.now() + '" alt="" />'
          : '<div class="thumb"></div>';
        const frameBtn = u.completed ? '<button class="btn frame" data-act="frame" data-id="' + u.id + '">Frame</button>' : '';
        // Export panel: download original + build a configurable proxy URL for camera-motion.
        const exportBtn = u.completed ? '<button class="btn export" data-act="export" data-id="' + u.id + '">Export</button>' : '';
        // Open the frame in camera-fisheye to tune lens-distortion correction for this video.
        const fisheyeBtn = u.completed && CAMERA_FISHEYE_URL ? '<button class="btn fisheye" data-act="fisheye" data-id="' + u.id + '">Fisheye</button>' : '';
        return '' +
          '<tr data-row="' + u.id + '">' +
            '<td data-thumbcell="' + u.id + '">' + thumb + '</td>' +
            '<td style="min-width:200px">' +
              '<div data-titlecell="' + u.id + '">' + titleLabelHTML(u.id) + '</div>' +
              '<div class="muted">' + esc(u.filename || u.id) + ' · ' + fmtSize(u.size) +
                (u.duration ? ' · ' + fmtTime(u.duration) : '') + '</div>' +
            '</td>' +
            '<td style="min-width:180px"><div class="tags" data-tags="' + u.id + '"></div></td>' +
            '<td><div class="bar"><span data-bar="' + u.id + '" style="width:' + u.percent.toFixed(1) + '%"></span></div></td>' +
            '<td data-status="' + u.id + '"></td>' +
            '<td class="actions">' + frameBtn + ' ' + exportBtn + ' ' + fisheyeBtn +
              ' <button class="btn danger" data-act="delete" data-id="' + u.id + '">Delete</button></td>' +
          '</tr>' +
          '<tr data-picker-row="' + u.id + '" style="display:none"><td colspan="6"><div data-picker="' + u.id + '"></div></td></tr>' +
          '<tr data-export-row="' + u.id + '" style="display:none"><td colspan="6"><div data-export="' + u.id + '"></div></td></tr>';
      }).join('');

      uploadsEl.innerHTML =
        '<table><thead><tr><th></th><th>Title</th><th>Tags</th><th>Progress</th><th>Status</th><th></th></tr></thead>' +
        '<tbody>' + rows + '</tbody></table>';

      uploads.forEach(u => { updateStatus(u); renderTags(u.id); });
      refreshPerspectiveBadges(uploads);
      bindActions();
    }

    // Cached presence map {id: bool} from camera-fisheye, so the 3s status poll can
    // re-render the badge from cache without clobbering it or re-fetching.
    let perspectivePresent = {};

    function perspBadgeHTML(id) {
      if (perspectivePresent[id] === true) return '<span class="badge done">perspective</span>';
      if (perspectivePresent[id] === false) return '<span class="badge absent">no perspective</span>';
      return '';
    }

    // Ask camera-fisheye which videos already have a saved perspective, update the
    // cache and the rendered badges. Degrades silently if the service is unreachable.
    async function refreshPerspectiveBadges(uploads) {
      if (!CAMERA_FISHEYE_URL) return;
      const ids = uploads.filter(u => u.completed).map(u => u.id);
      if (!ids.length) return;
      try {
        const present = await (await fetch(CAMERA_FISHEYE_URL + '/perspectives?ids=' + encodeURIComponent(ids.join(',')))).json();
        Object.assign(perspectivePresent, present);
      } catch (e) { return; }
      ids.forEach(id => {
        const el = uploadsEl.querySelector('[data-persp="' + id + '"]');
        if (el) el.innerHTML = perspBadgeHTML(id);
      });
    }

    // Re-check perspectives when the tab regains focus (e.g. after saving in the
    // camera-fisheye tab), so the badge updates without a full page reload.
    window.addEventListener('focus', () => refreshPerspectiveBadges(currentUploads));

    // Open camera-fisheye for a video, handing it the video id and a frame URL.
    function openFisheye(id) {
      if (!CAMERA_FISHEYE_URL) return;
      const u = currentUploads.find(x => x.id === id) || {};
      const t = (u.thumbnail_t != null) ? u.thumbnail_t : 0;
      const frame = location.origin + '/uploads/' + id + '/frame?t=' + t;
      window.open(CAMERA_FISHEYE_URL + '/client?upload_id=' + encodeURIComponent(id) +
        '&image_url=' + encodeURIComponent(frame), '_blank', 'noopener');
    }

    function updateStatus(u) {
      const bar = uploadsEl.querySelector('[data-bar="' + u.id + '"]');
      const st = uploadsEl.querySelector('[data-status="' + u.id + '"]');
      if (bar) bar.style.width = u.percent.toFixed(1) + '%';
      if (st) st.innerHTML = u.completed
        ? '<div class="status-badges"><span class="badge done">ready</span><span data-persp="' + u.id + '">' + perspBadgeHTML(u.id) + '</span></div>'
        : '<span class="badge progress">' + u.percent.toFixed(1) + '%</span>';
      // The thumbnail is generated server-side only after the upload finishes.
      // Since a completing upload does not change the row set (no full re-render),
      // insert the image here once it becomes available.
      const cell = uploadsEl.querySelector('[data-thumbcell="' + u.id + '"]');
      if (cell && u.has_thumbnail && !cell.querySelector('img')) {
        cell.innerHTML = '<img class="thumb" src="/uploads/' + u.id + '/thumbnail?ts=' + Date.now() + '" alt="" />';
      }
    }

    function renderTags(id) {
      const box = uploadsEl.querySelector('[data-tags="' + id + '"]');
      if (!box) return;
      const tags = rowState[id].tags;
      box.innerHTML = tags.map((t, i) =>
        '<span class="tag">' + esc(t) + '<button data-act="untag" data-id="' + id + '" data-i="' + i + '">×</button></span>'
      ).join('') +
        '<input class="tag-input" list="all-tags" data-act="addtag" data-id="' + id + '" placeholder="+ tag" />';
      box.querySelector('[data-act="untag"]') && box.querySelectorAll('[data-act="untag"]').forEach(b => {
        b.onclick = () => { rowState[id].tags.splice(+b.dataset.i, 1); renderTags(id); saveMeta(id); };
      });
      const input = box.querySelector('[data-act="addtag"]');
      input.onkeydown = e => {
        if (e.key !== 'Enter') return;
        const val = input.value.trim();
        input.value = '';
        if (!val) return;
        // Ignore duplicates (e.g. picking an existing tag again).
        if (rowState[id].tags.includes(val)) { renderTags(id); return; }
        rowState[id].tags.push(val);
        renderTags(id);
        saveMeta(id);
      };
    }

    function bindActions() {
      uploadsEl.querySelectorAll('[data-act="delete"]').forEach(b => {
        b.onclick = async () => {
          const id = b.dataset.id;
          const u = currentUploads.find(x => x.id === id) || {};
          const name = (rowState[id] && rowState[id].title) || u.filename || id;
          if (!confirm('Delete "' + name + '"? This cannot be undone.')) return;
          await api('DELETE', '/uploads/' + id);
          delete rowState[id];
          refresh(true);
        };
      });
      uploadsEl.querySelectorAll('[data-act="titlelabel"]').forEach(el => {
        el.onclick = () => editTitle(el.dataset.id);
      });
      uploadsEl.querySelectorAll('[data-act="frame"]').forEach(b => {
        b.onclick = () => togglePicker(b.dataset.id);
      });
      uploadsEl.querySelectorAll('[data-act="export"]').forEach(b => {
        b.onclick = () => toggleExport(b.dataset.id);
      });
      uploadsEl.querySelectorAll('[data-act="fisheye"]').forEach(b => {
        b.onclick = () => openFisheye(b.dataset.id);
      });
    }

    async function copyButton(btn, url, promptLabel) {
      try {
        await navigator.clipboard.writeText(url);
        const old = btn.textContent; btn.textContent = 'Copied!';
        setTimeout(() => { btn.textContent = old; }, 1200);
      } catch (e) { prompt(promptLabel, url); }
    }

    // Human-readable name of a row, for panel headers.
    function rowName(id) {
      const u = currentUploads.find(x => x.id === id) || {};
      const t = (rowState[id] && rowState[id].title) || '';
      return t || u.filename || id;
    }
    // Highlight the source row (and its panel rows) to match the open panel, so
    // it's obvious which upload an expanded panel belongs to.
    function applyRowHighlight(id) {
      const tr = uploadsEl.querySelector('[data-row="' + id + '"]');
      const pRow = uploadsEl.querySelector('[data-picker-row="' + id + '"]');
      const eRow = uploadsEl.querySelector('[data-export-row="' + id + '"]');
      // The source row takes the colour of whichever panel is open (frame wins).
      const type = pickerOpen[id] ? 'frame' : (exportOpen[id] ? 'export' : null);
      if (tr) {
        tr.classList.toggle('row-open', !!type);
        tr.classList.toggle('open-frame', type === 'frame');
        tr.classList.toggle('open-export', type === 'export');
      }
      if (pRow) {
        pRow.classList.toggle('row-open', !!pickerOpen[id]);
        pRow.classList.toggle('open-frame', !!pickerOpen[id]);
      }
      if (eRow) {
        eRow.classList.toggle('row-open', !!exportOpen[id]);
        eRow.classList.toggle('open-export', !!exportOpen[id]);
      }
    }

    // ---------- export panel (download original + configurable proxy URL) ----------
    let exportOpen = {};
    function toggleExport(id) {
      const row = uploadsEl.querySelector('[data-export-row="' + id + '"]');
      const box = uploadsEl.querySelector('[data-export="' + id + '"]');
      exportOpen[id] = !exportOpen[id];
      row.style.display = exportOpen[id] ? '' : 'none';
      applyRowHighlight(id);
      if (!exportOpen[id]) { box.innerHTML = ''; return; }

      const dlUrl = location.origin + '/uploads/' + id + '/download';
      box.innerHTML =
        '<div class="picker export-panel">' +
          '<div class="row picker-head"><span class="panel-title"><b>Export</b>' +
            '<span class="panel-for">' + esc(rowName(id)) + '</span></span>' +
            '<button class="btn close" data-closeexport="' + id + '">Close ✕</button></div>' +

          '<h4>Original</h4>' +
          '<div class="row">' +
            '<a class="btn" href="' + dlUrl + '">Download original</a>' +
            '<input class="url-box" readonly value="' + dlUrl + '" data-origurl />' +
            '<button class="btn" data-copyorig>Copy</button>' +
          '</div>' +

          '<h4>Exports for camera-motion</h4>' +
          '<div class="row"><button class="btn primary" data-addexport>+ Add export</button></div>' +
          '<div data-exportlist></div>' +
        '</div>';

      box.querySelector('[data-copyorig]').onclick = e => copyButton(e.currentTarget, dlUrl, 'Original URL:');
      box.querySelector('[data-closeexport="' + id + '"]').onclick = () => toggleExport(id);
      box.querySelector('[data-addexport]').onclick = async () => {
        await api('POST', '/uploads/' + id + '/exports', { fps: 0.1, width: 480, gray: true });
        renderExports(id, box);
      };
      renderExports(id, box);
    }

    // Render the saved export records for an upload into the panel's list.
    async function renderExports(id, box) {
      const listEl = box.querySelector('[data-exportlist]');
      if (!listEl) return;
      let exports = [];
      try { exports = ((await (await api('GET', '/uploads/' + id + '/exports')).json()).exports) || []; } catch (e) {}
      listEl.innerHTML = '';
      if (!exports.length) {
        listEl.innerHTML = '<p class="muted">No exports yet. Click “+ Add export”.</p>';
        return;
      }
      // Ask camera-motion which of these records already have an analysis result,
      // so each row can show a present/absent badge.
      let present = {};
      if (CAMERA_MOTION_URL) {
        try {
          const ids = exports.map(r => r.id).join(',');
          present = await (await fetch(CAMERA_MOTION_URL + '/results?ids=' + encodeURIComponent(ids))).json();
        } catch (e) {}
      }
      exports.forEach(rec => listEl.appendChild(exportRow(id, box, rec, !!present[rec.id])));
    }

    // One editable export record (params + proxy URL + actions).
    function exportRow(id, box, rec, analyzed) {
      const wrap = document.createElement('div');
      wrap.className = 'export-rec';
      wrap.innerHTML =
        '<div class="row">' +
          '<span class="badge ' + (analyzed ? 'done' : 'absent') + '">' + (analyzed ? 'analyzed' : 'not analyzed') + '</span>' +
          '<label>fps <input type="number" step="0.5" data-f style="width:70px" /></label>' +
          '<label>width <input type="number" data-w style="width:80px" /></label>' +
          '<label>grayscale <input type="checkbox" data-g /></label>' +
          '<button class="btn" data-save>Save</button>' +
          '<button class="btn danger" data-del>Delete</button>' +
        '</div>' +
        '<div class="row">' +
          '<input class="url-box" readonly data-url />' +
          '<button class="btn" data-copy>Copy</button>' +
          '<a class="btn" data-open target="_blank" rel="noopener">Open</a>' +
          '<button class="btn primary" data-motion>Open in camera-motion</button>' +
        '</div>';
      const f = wrap.querySelector('[data-f]');
      const w = wrap.querySelector('[data-w]');
      const g = wrap.querySelector('[data-g]');
      const urlBox = wrap.querySelector('[data-url]');
      const openLink = wrap.querySelector('[data-open]');
      f.value = rec.fps; w.value = rec.width; g.checked = rec.gray;
      const proxyUrl = () => {
        const ff = parseFloat(f.value) || 4, ww = parseInt(w.value, 10) || 480, gg = g.checked ? 1 : 0;
        return location.origin + '/uploads/' + id + '/proxy?fps=' + ff + '&width=' + ww + '&gray=' + gg;
      };
      const refresh = () => { const u = proxyUrl(); urlBox.value = u; openLink.href = u; };
      [f, w].forEach(el => el.oninput = refresh);
      g.onchange = refresh;
      refresh();
      wrap.querySelector('[data-copy]').onclick = e => copyButton(e.currentTarget, urlBox.value, 'Proxy URL (for camera-motion):');
      wrap.querySelector('[data-motion]').onclick = () =>
        window.open(CAMERA_MOTION_URL + '/client?upload=' + encodeURIComponent(location.origin) +
          '&upload_id=' + encodeURIComponent(id) + '&export_id=' + encodeURIComponent(rec.id), '_blank', 'noopener');
      wrap.querySelector('[data-save]').onclick = async e => {
        const btn = e.currentTarget;
        await api('PUT', '/uploads/' + id + '/exports/' + rec.id,
          { fps: parseFloat(f.value) || 4, width: parseInt(w.value, 10) || 480, gray: g.checked });
        btn.textContent = 'Saved ✓';
        setTimeout(() => { btn.textContent = 'Save'; }, 1200);
      };
      wrap.querySelector('[data-del]').onclick = async () => {
        await api('DELETE', '/uploads/' + id + '/exports/' + rec.id);
        renderExports(id, box);
      };
      return wrap;
    }

    // ---------- title: label that becomes an input on click ----------
    function titleLabelHTML(id) {
      const t = (rowState[id] && rowState[id].title) || '';
      const inner = t ? esc(t) : '<span class="muted">Add title…</span>';
      return '<span class="title-label" data-act="titlelabel" data-id="' + id + '">' + inner + '</span>';
    }
    function restoreLabel(id) {
      const cell = uploadsEl.querySelector('[data-titlecell="' + id + '"]');
      if (!cell) return;
      cell.innerHTML = titleLabelHTML(id);
      const lbl = cell.querySelector('[data-act="titlelabel"]');
      if (lbl) lbl.onclick = () => editTitle(id);
    }
    function editTitle(id) {
      const cell = uploadsEl.querySelector('[data-titlecell="' + id + '"]');
      if (!cell) return;
      const u = currentUploads.find(x => x.id === id) || {};
      const current = (rowState[id] && rowState[id].title) || '';
      cell.innerHTML = '<input class="title-input" value="' + esc(current) + '" placeholder="' + esc(u.filename || id) + '" />';
      const input = cell.querySelector('input');
      input.focus();
      input.select();
      let saved = false;
      input.onkeydown = e => {
        if (e.key === 'Enter') {
          saved = true;
          rowState[id].title = input.value.trim();
          saveMeta(id);
          restoreLabel(id);
        } else if (e.key === 'Escape') {
          restoreLabel(id);
        }
      };
      // Losing focus without pressing Enter discards the edit.
      input.onblur = () => { if (!saved) restoreLabel(id); };
    }

    // ---------- frame picker ----------
    let pickerOpen = {};
    function togglePicker(id) {
      const row = uploadsEl.querySelector('[data-picker-row="' + id + '"]');
      const box = uploadsEl.querySelector('[data-picker="' + id + '"]');
      pickerOpen[id] = !pickerOpen[id];
      row.style.display = pickerOpen[id] ? '' : 'none';
      applyRowHighlight(id);
      if (!pickerOpen[id]) { box.innerHTML = ''; return; }

      const up = currentUploads.find(u => u.id === id);
      const dur = up && up.duration ? up.duration : 10;
      // If a thumbnail was saved from a specific time, reopen the picker there.
      let start = Math.min(1, dur / 2);
      if (up && up.thumbnail_t != null) start = Math.max(0, Math.min(up.thumbnail_t, dur));
      box.innerHTML =
        '<div class="picker frame-panel">' +
          '<div class="row picker-head"><span class="panel-title"><b>Frame</b>' +
            '<span class="panel-for">' + esc(rowName(id)) + '</span></span>' +
            '<button class="btn close" data-closepicker="' + id + '">Close ✕</button></div>' +
          '<div class="row"><label>Time: <b data-t="' + id + '">' + start.toFixed(1) + 's</b></label>' +
          '<input type="range" min="0" max="' + dur.toFixed(1) + '" step="0.1" value="' + start + '" data-slider="' + id + '" /></div>' +
          '<img data-preview="' + id + '" src="/uploads/' + id + '/frame?t=' + start + '" alt="frame preview" />' +
          '<div class="row">' +
            '<button class="btn primary" data-setthumb="' + id + '">Set as thumbnail</button>' +
          '</div>' +
          '<div class="row">' +
            '<input class="url-box" data-urlbox="' + id + '" readonly value="' + frameUrl(id, start) + '" />' +
            '<button class="btn" data-copyurl="' + id + '">Copy</button>' +
          '</div>' +
        '</div>';

      box.querySelector('[data-closepicker="' + id + '"]').onclick = () => togglePicker(id);

      const slider = box.querySelector('[data-slider="' + id + '"]');
      const tLabel = box.querySelector('[data-t="' + id + '"]');
      const preview = box.querySelector('[data-preview="' + id + '"]');
      const urlbox = box.querySelector('[data-urlbox="' + id + '"]');
      let timer = null;
      slider.oninput = () => {
        const t = parseFloat(slider.value);
        tLabel.textContent = t.toFixed(1) + 's';
        urlbox.value = frameUrl(id, t);
        clearTimeout(timer);
        timer = setTimeout(() => { preview.src = '/uploads/' + id + '/frame?t=' + t; }, 250);
      };
      box.querySelector('[data-setthumb="' + id + '"]').onclick = async () => {
        const t = parseFloat(slider.value);
        await api('POST', '/uploads/' + id + '/thumbnail', { t });
        refresh(true);
      };
      box.querySelector('[data-copyurl="' + id + '"]').onclick = async () => {
        try { await navigator.clipboard.writeText(urlbox.value); urlbox.select(); } catch (e) { urlbox.select(); }
      };
    }
    function frameUrl(id, t) {
      return location.origin + '/uploads/' + id + '/frame?t=' + t;
    }

    // ---------- filtering & pagination ----------
    const searchEl = document.getElementById('search');
    const tagFiltersEl = document.getElementById('tag-filters');
    const pagerEl = document.getElementById('pager');
    let allTags = [];
    const filter = { q: '', tags: new Set(), page: 1, pageSize: 20 };
    let pageInfo = { total: 0, page: 1, pages: 1 };

    function buildQuery() {
      const p = new URLSearchParams();
      if (filter.q) p.set('q', filter.q);
      filter.tags.forEach(t => p.append('tag', t));
      p.set('page', filter.page);
      p.set('page_size', filter.pageSize);
      return p.toString();
    }

    function renderTagFilters() {
      tagFiltersEl.innerHTML = allTags.map(t =>
        '<span class="filter-tag' + (filter.tags.has(t) ? ' active' : '') + '" data-ftag="' + esc(t) + '">' + esc(t) + '</span>'
      ).join('');
      tagFiltersEl.querySelectorAll('[data-ftag]').forEach(el => {
        el.onclick = () => {
          const t = el.dataset.ftag;
          filter.tags.has(t) ? filter.tags.delete(t) : filter.tags.add(t);
          filter.page = 1;
          renderTagFilters();
          refresh(true);
        };
      });
    }

    function renderPager() {
      const { total, page, pages } = pageInfo;
      if (total === 0) { pagerEl.innerHTML = ''; return; }
      pagerEl.innerHTML =
        '<button class="btn" data-pg="prev"' + (page <= 1 ? ' disabled' : '') + '>‹ Prev</button>' +
        '<span>Page ' + page + ' of ' + Math.max(pages, 1) + ' · ' + total + ' total</span>' +
        '<button class="btn" data-pg="next"' + (page >= pages ? ' disabled' : '') + '>Next ›</button>';
      const prev = pagerEl.querySelector('[data-pg="prev"]');
      const next = pagerEl.querySelector('[data-pg="next"]');
      if (prev) prev.onclick = () => { if (filter.page > 1) { filter.page--; refresh(true); } };
      if (next) next.onclick = () => { if (filter.page < pages) { filter.page++; refresh(true); } };
    }

    let searchTimer = null;
    searchEl.oninput = () => {
      clearTimeout(searchTimer);
      searchTimer = setTimeout(() => {
        filter.q = searchEl.value.trim();
        filter.page = 1;
        refresh(true);
      }, 300);
    };

    // ---------- polling ----------
    let currentUploads = [];
    async function refresh(force) {
      try {
        const res = await fetch('/uploads?' + buildQuery());
        const data = await res.json();
        const uploads = data.uploads || [];
        currentUploads = uploads;
        pageInfo = { total: data.total || 0, page: data.page || 1, pages: data.pages || 1 };
        // Initialize edit state for new uploads without clobbering ongoing edits.
        uploads.forEach(u => {
          if (!rowState[u.id]) rowState[u.id] = { title: u.title, tags: (u.tags || []).slice() };
        });
        // Include completion state in the signature so that when an upload
        // finishes (gaining Frame/Export/Download actions) the row is fully
        // re-rendered — not just its progress badge.
        const sig = uploads.map(u => u.id + ':' + (u.completed ? 1 : 0)).join(',');
        if (force || sig !== renderedIds) {
          renderedIds = sig;
          render(uploads);
        } else {
          uploads.forEach(updateStatus);
        }
        renderPager();
      } catch (e) {
        uploadsEl.innerHTML = '<p class="muted">Failed to load uploads.</p>';
      }
    }
    async function loadTags() {
      try {
        const res = await fetch('/tags');
        const data = await res.json();
        allTags = data.tags || [];
        tagsDatalist.innerHTML = allTags.map(t => '<option value="' + esc(t) + '">').join('');
        // Drop any selected filter tags that no longer exist.
        filter.tags.forEach(t => { if (!allTags.includes(t)) filter.tags.delete(t); });
        renderTagFilters();
      } catch (e) {}
    }

    loadTags();
    refresh(true);
    setInterval(refresh, 3000);
  </script>
</body>
</html>
